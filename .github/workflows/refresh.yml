name: Refresh catalogue

# The nightly data flow. Postgres is the source of truth; this keeps the CSV
# backup current and works through the enrichment backlog.
#
#   1. export the database to data/albums.csv
#   2. enrich a batch of albums that still lack genres or artwork
#   3. push that enrichment back to the database
#   4. commit the CSV, so git holds a dated history of the collection
#
# Enrichment is batched because MusicBrainz allows one request a second, and a
# miss costs several tries: measured at 4.8s an album, so 300 is about 25
# minutes and the full 4,476 is roughly six hours. Once the backlog is cleared
# this step finds almost nothing to do and the run takes about a minute.
#
# This runs on GitHub's machines, not yours -- the schedule fires whether or
# not your computer is on. To do the whole backfill here instead of locally,
# use "Run workflow" with a batch of 5000 -- but note a job is capped at six
# hours, which the full backfill only just fits inside. Two runs of 2500 is
# the safer way to do it.

on:
  schedule:
    - cron: "0 7 * * *"      # 07:00 UTC daily — 01:00 in Mexico City
  workflow_dispatch:
    inputs:
      batch:
        description: "How many albums to enrich this run (~25 min per 300)"
        default: "300"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      IMC_EMAIL: ${{ secrets.IMC_EMAIL }}
      IMC_PASSWORD: ${{ secrets.IMC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Both database steps are skipped until the Supabase secrets exist, so
      # enrichment can run on GitHub's machines before the database does.
      - name: Back the database up to CSV
        if: ${{ env.SUPABASE_URL != '' }}
        run: node scripts/export.mjs

      - name: Enrich a batch
        run: node scripts/enrich.mjs --limit=${{ inputs.batch || 300 }}

      # Albums that failed, or matched with no genres, get another go once
      # their 14-day cooldown is up. Most nights this finds nothing and exits
      # in seconds; occasionally MusicBrainz has gained a tag or a typo has
      # been fixed in the app.
      - name: Retry the gaps
        run: node scripts/enrich.mjs --retry --limit=150

      - name: Push genres and artwork back
        if: ${{ env.SUPABASE_URL != '' }}
        run: node scripts/import.mjs

      # Reports only; never fails the run. The database's unique index catches
      # exact collisions, but a misspelled artist is a different key everywhere
      # and becomes a second album silently.
      - name: Look for near-duplicates
        run: node scripts/find-duplicates.mjs

      - name: Commit the backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/albums.csv data/enrichment.json
          # Nothing changed is a normal outcome, not a failure.
          git diff --staged --quiet || git commit -m "Nightly backup and enrichment [skip ci]"
          git push
