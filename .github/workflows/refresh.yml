name: Refresh catalogue

# The nightly data flow. Postgres is the source of truth; this keeps the CSV
# backup current and works through the enrichment backlog.
#
#   1. export the database to data/albums.csv
#   2. enrich a batch of albums that still lack genres or artwork
#   3. push that enrichment back to the database
#   4. commit the CSV, so git holds a dated history of the collection
#
# Enrichment is batched because MusicBrainz allows one request a second, and a
# miss costs several tries: measured at 4.8s an album, so 300 is about 25
# minutes and the full 4,476 is roughly six hours. Once the backlog is cleared
# this step finds almost nothing to do and the run takes about a minute.
#
# This runs on GitHub's machines, not yours -- the schedule fires whether or
# not your computer is on. To do the whole backfill here instead of locally,
# use "Run workflow" with a batch of 5000 -- but note a job is capped at six
# hours, which the full backfill only just fits inside. Two runs of 2500 is
# the safer way to do it.

on:
  schedule:
    - cron: "0 7 * * *"      # 07:00 UTC daily — 01:00 in Mexico City
  workflow_dispatch:
    inputs:
      batch:
        description: "How many albums to enrich this run (~25 min per 300)"
        default: "300"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      IMC_EMAIL: ${{ secrets.IMC_EMAIL }}
      IMC_PASSWORD: ${{ secrets.IMC_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Both database steps are skipped until the Supabase secrets exist, so
      # enrichment can run on GitHub's machines before the database does.
      - name: Back the database up to CSV
        if: ${{ env.SUPABASE_URL != '' }}
        run: node scripts/export.mjs

      # enrich.mjs already finds the right record for a misspelled album --
      # viaArtist() searches inside the artist's own discography -- but it
      # stores the result under the wrong name and throws the correction away.
      # This turns that into a rename, before enrichment runs, so the corrected
      # name is what gets matched below.
      #
      # Only the confident tier is applied. suggest-renames holds back anything
      # that changes a sequence number (Pt. 2 is one edit from Pt. 1), gains or
      # loses a whole word (a different release), drops a credited artist
      # (MusicBrainz credits one, the shelf may list two), or is merely house
      # style. Those land in data/rename-suggestions-review.json for a human.
      #
      # --db carries the rename into Postgres as well: import.mjs matches rows
      # on artist and title, so a CSV-only rename would be inserted as a new
      # album beside the one it was correcting.
      - name: Correct misspelled names
        if: ${{ env.SUPABASE_URL != '' }}
        run: |
          node scripts/suggest-renames.mjs --limit=60 \
            --out=data/rename-suggestions.json
          if [ -s data/rename-suggestions.json ] && \
             [ "$(tr -d '[:space:]' < data/rename-suggestions.json)" != "[]" ]; then
            node scripts/rename.mjs --file data/rename-suggestions.json --refresh --db
          else
            echo "nothing confident enough to apply tonight"
          fi

      # --prune collects records left behind by a rename done in the app: the
      # browser cannot touch enrichment.json, so the record under the old name
      # survives with nothing pointing at it. This runs after the export above,
      # so it prunes against what the database actually holds.
      - name: Enrich a batch
        run: node scripts/enrich.mjs --prune --limit=${{ inputs.batch || 300 }}

      # Albums that failed, or matched with no genres, get another go once
      # their 14-day cooldown is up. Most nights this finds nothing and exits
      # in seconds; occasionally MusicBrainz has gained a tag or a typo has
      # been fixed in the app.
      - name: Retry the gaps
        run: node scripts/enrich.mjs --retry --limit=150

      # Artwork found tonight points at coverartarchive.org, which is a lookup
      # that redirects twice and takes 1.2-3.1s. Copy anything new into
      # Storage before the import, so one import pushes the fast URLs along
      # with everything else. Already-cached covers are skipped, so on a normal
      # night this is a handful of albums.
      - name: Cache any new artwork
        if: ${{ env.SUPABASE_URL != '' }}
        run: node scripts/cache-covers.mjs --if-configured --limit=200

      - name: Push genres and artwork back
        if: ${{ env.SUPABASE_URL != '' }}
        run: node scripts/import.mjs

      # Export again. The first one ran before this job had done anything, so
      # everything after it -- the backup committed to git, the genre roots,
      # the maintenance list, tonight's five -- was reading the database as it
      # looked BEFORE tonight's renames, enrichment and artwork landed. The
      # backup was permanently a day behind and the maintenance screen listed
      # problems this run had already fixed.
      - name: Re-export now the run has finished
        if: ${{ env.SUPABASE_URL != '' }}
        run: node scripts/export.mjs

      # Reports only. The genre/style split needs no nightly run -- genres.js
      # computes it in the browser from the whole collection, so a new album is
      # classified the moment it loads. What goes stale is the fixed list of
      # ROOTS, and whether a style has outgrown it is a judgement, not a rule.
      - name: Check the genre roots
        run: node scripts/genre-report.mjs

      # Everything the run could not decide on its own, collected for the
      # maintenance screen. Reads only -- each item is a judgement someone has
      # to make, which is exactly why it is still outstanding.
      #
      # This runs find-duplicates itself, so there is no separate step for it.
      # There used to be one, printing the same comparison into a log nobody
      # reads while this step turned it into the section you actually see.
      - name: Collect what still needs a person
        run: node scripts/health-report.mjs

      # The homepage reads app/daily.json, which ships with the app -- Vercel's
      # root directory is app/, so committing it redeploys it. Nothing to fetch
      # from the database at page load, and the front page is complete the
      # moment it opens.
      - name: Choose today's five
        run: node scripts/daily-picks.mjs --force

      - name: Commit the backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README.md is here because health-report.mjs rewrites the figures
          # in its opening table. Prose that goes stale teaches you not to
          # trust the page, so the run that knows the numbers writes them.
          git add data/albums.csv data/enrichment.json app/daily.json \
                  app/health.json README.md
          git add data/rename-suggestions.json \
                  data/rename-suggestions-review.json 2>/dev/null || true
          # Nothing changed is a normal outcome, not a failure.
          if git diff --staged --quiet; then
            echo "nothing changed tonight"
            exit 0
          fi
          git commit -m "Nightly backup and enrichment [skip ci]"

          # The run takes about ten minutes, so a push during that window
          # leaves this commit behind the remote and the push is rejected.
          # These files are generated from the database, so on a conflict the
          # copy this run just produced is the right one -- during a rebase
          # "theirs" means the commit being replayed, which is ours.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto the new main"
            git pull --rebase -X theirs origin main || { git rebase --abort || true; exit 1; }
          done
          echo "could not push after 3 attempts"
          exit 1
