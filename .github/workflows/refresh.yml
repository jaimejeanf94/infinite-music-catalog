name: Refresh catalogue

# The nightly data flow. Postgres is the source of truth; this keeps the CSV
# backup current and works through the enrichment backlog.
#
#   1. export the database to data/albums.csv
#   2. enrich a batch of albums that still lack genres or artwork
#   3. push that enrichment back to the database
#   4. commit the CSV, so git holds a dated history of the collection
#
# Enrichment is batched because MusicBrainz allows one request a second: the
# full collection is ~75 minutes, 300 albums is about seven.

on:
  schedule:
    - cron: "0 7 * * *"      # 07:00 UTC daily — 01:00 in Mexico City
  workflow_dispatch:
    inputs:
      batch:
        description: "How many albums to enrich this run"
        default: "300"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      IMC_EMAIL: ${{ secrets.IMC_EMAIL }}
      IMC_PASSWORD: ${{ secrets.IMC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Back the database up to CSV
        run: node scripts/export.mjs

      - name: Enrich a batch
        run: node scripts/enrich.mjs --limit=${{ inputs.batch || 300 }}

      - name: Push genres and artwork back
        run: node scripts/import.mjs

      - name: Commit the backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/albums.csv data/enrichment.json
          # Nothing changed is a normal outcome, not a failure.
          git diff --staged --quiet || git commit -m "Nightly backup and enrichment [skip ci]"
          git push
