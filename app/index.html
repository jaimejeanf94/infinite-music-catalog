<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121110" />
<title>Infinite Music Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />

<!-- No build step: React, Babel and the Supabase client all load from a CDN,
     and the .jsx files below are compiled in the browser. Same approach as
     Diego's vinyl app -- edit a file, refresh, done. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="local-source.js"></script>
<script src="roller.js"></script>
<script src="genres.js"></script>
<script type="text/babel" src="cover-art.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="admin.jsx"></script>
<script type="text/babel" src="roll.jsx"></script>
<script type="text/babel" src="browse.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useCallback } = React;

function SignIn({ onDone }) {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true); setErr("");
    const { error } = await db.signIn(email, pw);
    setBusy(false);
    if (error) return setErr(error.message);
    onDone();
  };

  return (
    <div className="sheet" onClick={onDone}>
      <form className="sheet__inner sheet__inner--sm" onClick={(e) => e.stopPropagation()} onSubmit={submit}>
        <button type="button" className="sheet__x" onClick={onDone} aria-label="Close">×</button>
        <h2 className="card__title">Sign in</h2>
        <p className="muted">Signing in unlocks rating, notes and the listening log.</p>
        <label className="field"><span>Email</span>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required />
        </label>
        <label className="field"><span>Password</span>
          <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} required />
        </label>
        {err && <div className="err">{err}</div>}
        <button className="btn btn--primary" disabled={busy}>{busy ? "…" : "Sign in"}</button>
      </form>
    </div>
  );
}

// The hash carries both the screen and its state: #/browse?filter=unscored&q=slowdive
// Written with history.replaceState/pushState rather than by assigning
// location.hash, so typing in the search box does not leave one history entry
// per keystroke -- and so we control which changes Back should undo.
function parseHash() {
  const raw = (location.hash || "").replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  return { route: path || "home", params: new URLSearchParams(qs || "") };
}

function writeHash(route, params, { push } = {}) {
  const qs = params.toString();
  const url = `#/${route}${qs ? "?" + qs : ""}`;
  if (url === location.hash) return;
  history[push ? "pushState" : "replaceState"](null, "", url);
}

function App() {
  const [albums, setAlbums] = useState([]);
  const [status, setStatus] = useState("loading");
  const [error, setError] = useState("");
  const [user, setUser] = useState(null);
  const [showSignIn, setShowSignIn] = useState(false);
  const [loc, setLoc] = useState(parseHash);
  const { route, params } = loc;

  useEffect(() => {
    // popstate covers Back and Forward between pushState entries; hashchange
    // covers a link or a pasted URL.
    const sync = () => setLoc(parseHash());
    window.addEventListener("hashchange", sync);
    window.addEventListener("popstate", sync);
    return () => {
      window.removeEventListener("hashchange", sync);
      window.removeEventListener("popstate", sync);
    };
  }, []);

  // opts.route moves between screens; without it the route is left alone, so
  // every existing caller keeps working unchanged.
  const setParams = useCallback((next, opts = {}) => {
    writeHash(opts.route || parseHash().route, next, opts);
    setLoc(parseHash());
  }, []);

  useEffect(() => {
    db.currentUser().then(setUser);
    const off = db.onAuthChange(setUser);
    db.albums()
      .then((rows) => { setAlbums(rows); setStatus(rows.length ? "ready" : "empty"); })
      .catch((e) => { setError(e.message || String(e)); setStatus("error"); });
    return off;
  }, []);

  // Optimistic: the UI moves now, the database catches up. If the write fails
  // (usually "signed out"), put the old value back and say so.
  const onPatch = useCallback((id, patch, quiet) => {
    let before;
    setAlbums((rows) => rows.map((a) => {
      if (a.id !== id) return a;
      before = a;
      return { ...a, ...patch };
    }));
    db.updateAlbum(id, patch).catch((e) => {
      setAlbums((rows) => rows.map((a) => (a.id === id && before ? before : a)));
      if (!quiet) setError(e.message || String(e));
    });
  }, []);

  const onAdd = useCallback(async (fields) => {
    const created = await db.addAlbum(fields);
    setAlbums((rows) => [...rows, created].sort(
      (a, b) => a.artist.localeCompare(b.artist) || a.title.localeCompare(b.title)));
  }, []);

  const onDelete = useCallback((id) => {
    let removed;
    setAlbums((rows) => rows.filter((a) => {
      if (a.id !== id) return true;
      removed = a;
      return false;
    }));
    db.deleteAlbum(id).catch((e) => {
      // Put it back if the database refused.
      if (removed) setAlbums((rows) => [...rows, removed].sort(
        (a, b) => a.artist.localeCompare(b.artist) || a.title.localeCompare(b.title)));
      setError(e.message || String(e));
    });
  }, []);

  const onRestore = useCallback(async (id) => {
    await db.restoreAlbum(id);
    const rows = await db.albums();
    setAlbums(rows);
  }, []);

  const onRoll = useCallback((album, mode) => {
    // Only the owner can write history, and a failed log should never
    // interrupt a roll, so this one stays silent.
    db.logRoll(album.id, mode).catch(() => {});
  }, []);

  if (status === "loading") return <div className="boot"><h1>Infinite Music Catalog</h1><p className="muted">Loading the collection…</p></div>;

  if (status === "error") return (
    <div className="boot">
      <h1>Could not load</h1>
      <p className="err">{error}</p>
      <p className="muted">Check that db/schema.sql ran and that config.js has the right project URL.</p>
    </div>
  );

  if (status === "empty") return (
    <div className="boot">
      <h1>No albums yet</h1>
      <p className="muted">The database is connected but empty — import
      <code>data/albums.csv</code> into the <code>albums</code> table and refresh.</p>
    </div>
  );

  return (
    <>
      <header className="top">
        <nav className="nav">
          <a className={"nav__a" + (route === "home" ? " nav__a--on" : "")} href="#/">Home</a>
          <a className={"nav__a" + (route === "browse" ? " nav__a--on" : "")} href="#/browse">Shelf</a>
          <a className={"nav__a nav__a--last" + (route === "roll" ? " nav__a--on" : "")} href="#/roll">Roll</a>
          {!!user && params.get("as") !== "visitor" && (
            <a className={"nav__a nav__a--admin" + (route === "admin" ? " nav__a--on" : "")}
               href="#/admin">Fix</a>
          )}
        </nav>
        {db.mode === "local" && <span className="tag" title="Ratings are saved in this browser only">local</span>}
        {params.get("as") === "visitor" && (
          <a className="tag tag--preview" href={`#/${route}`} title="Leave the visitor preview">
            viewing as visitor ×
          </a>
        )}
        {/* The running head is on every screen, including home where the folio
            repeats it. A chrome that rearranges itself between pages is a worse
            problem than saying the name twice: the sign-out button moves, and
            the bar stops reading as one fixed thing.

            Below 560px the name is hidden (styles.css). That is a rule about
            WIDTH, applied identically on every screen, not a rule about which
            page you are on -- and it is the only way the bar fits a phone:
            nav, name and Sign in came to ~500px of content in a 398px bar, so
            the name wrapped to three lines and Sign in was cut off. */}
        <a className="brand" href="#/">Infinite Music Catalog</a>
        {db.mode === "local" ? null : user
          ? <button className="btn btn--quiet btn--sm" onClick={() => db.signOut()}>Sign out</button>
          : <button className="btn btn--quiet btn--sm" onClick={() => setShowSignIn(true)}>Sign in</button>}
      </header>

      {/* Append ?as=visitor to any view to see exactly what a signed-out
          visitor sees, without signing out. Owner-only: it can merely take
          abilities away, never grant them. */}
      <main>
        {/* Owner only. Signing out or the visitor preview sends you back to
            the shelf rather than showing an empty maintenance screen. */}
        {route === "admin"
          ? (!!user && params.get("as") !== "visitor"
              ? <AdminView albums={albums} onPatch={onPatch}
                           onGo={(to, extra) => setParams(new URLSearchParams(extra || {}),
                                                          { push: true, route: to })} />
              : <div className="empty">Sign in to see this.</div>)
          : route === "home"
          ? <HomeView albums={albums}
                      onGo={(to, extra) => setParams(new URLSearchParams(extra || {}),
                                                     { push: true, route: to })} />
          : route === "browse"
          ? <BrowseView albums={albums} owner={!!user && params.get("as") !== "visitor"} onPatch={onPatch}
                        onAdd={onAdd} onDelete={onDelete} onRestore={onRestore}
                        params={params} setParams={setParams} />
          : <RollView albums={albums} owner={!!user && params.get("as") !== "visitor"} onPatch={onPatch} onRoll={onRoll}
                       params={params} setParams={setParams} />}
      </main>

      {showSignIn && <SignIn onDone={() => setShowSignIn(false)} />}
      {error && (
        <div className="toast" role="alert" aria-live="assertive" onClick={() => setError("")}>
          {error} <span className="muted">(tap to dismiss)</span>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
